name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skill contract
        run: python3 scripts/validate_skill.py

      - name: Run test suite
        run: python3 -m unittest discover -s tests -v

      - name: Internal register gate (bilingual)
        working-directory: scripts
        run: python3 test_internal_register_scan.py

      - name: Process-logic gate
        working-directory: scripts
        run: python3 test_process_logic_scan.py

      - name: Vietnamese AI-pattern gate (bilingual)
        working-directory: scripts
        run: python3 test_vi_ai_pattern_scan.py
